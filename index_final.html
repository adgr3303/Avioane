<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Avioane - Duel</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#07111f;color:#eef6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:manipulation}
body{min-height:100vh}
.wrap{max-width:900px;margin:auto;padding:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
h1{font-size:24px;margin:0}.status{background:#12263d;border:1px solid #315271;border-radius:20px;padding:8px 11px;font-weight:800;font-size:12px}
.panel{background:#102238;border:1px solid #284767;border-radius:18px;padding:10px;margin-bottom:12px}
h2{font-size:18px;margin:0 0 3px}.sub{font-size:12px;color:#9db1c9;margin-bottom:9px}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;width:min(100%,560px);margin:auto}
.cell{appearance:none;border:1px solid #234765;background:#17304b;border-radius:5px;aspect-ratio:1;padding:0;position:relative;touch-action:manipulation}
.cell:active{transform:scale(.94)}
.cell.plane{background:#18a978;border-color:#58e9b4}
.cell.preview{outline:3px solid #ffd166;outline-offset:-3px}
.cell.hit{background:#c63838!important}.cell.miss{background:#344b63!important}
.cell.reveal{background:#76591b!important;border-color:#ffd166!important}
.cell.hit:after{content:"×";position:absolute;inset:0;display:grid;place-items:center;font-size:19px;font-weight:900}
.cell.miss:after{content:"•";position:absolute;inset:0;display:grid;place-items:center;font-size:25px;color:#d9e3ef}
.coords{display:grid;grid-template-columns:repeat(10,1fr);width:min(100%,560px);margin:3px auto 0;color:#718ba6;font-size:9px;text-align:center}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:sticky;bottom:0;padding:8px 0;background:linear-gradient(transparent,#07111f 25%);z-index:5}
.action{border:0;border-radius:12px;min-height:48px;color:white;background:#3182f6;font-weight:900;font-size:14px}
.secondary{background:#243c58}
.help{font-size:12px;color:#9db1c9;line-height:1.45;padding:4px 2px}
@media(max-width:420px){h1{font-size:21px}.panel{padding:8px}.grid{gap:2px}.cell{border-radius:3px}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>✈️ AVIOANE</h1><div id="status" class="status">Plasează avionul 1 din 3</div></header>

<section class="panel">
<h2>🟢 Avioanele mele</h2>
<div id="mySub" class="sub">Atinge o celulă pentru a plasa avionul.</div>
<div id="myGrid" class="grid"></div><div class="coords">A B C D E F G H I J</div>
</section>

<section class="panel">
<h2>🔴 Adversarul</h2>
<div class="sub">După plasare, atinge o celulă pentru a ataca.</div>
<div id="enemyGrid" class="grid"></div><div class="coords">A B C D E F G H I J</div>
</section>

<div class="controls">
<button class="action" id="newBtn">🔄 Joc nou</button>
<button class="action secondary" id="rotateBtn">↻ Rotește</button>
<button class="action secondary" id="revealBtn">👁 Avioane</button>
</div>
<div class="help">Ai 3 avioane de câte 3 celule. Plasează-le, apoi distruge toate celulele avioanelor adversarului.</div>
</div>

<script>
(function(){
"use strict";
const N=10,LEN=3;
let myPlanes=[],enemyPlanes=[],myShots=new Set(),enemyShots=new Set();
let placing=true,planeNumber=0,vertical=false,gameOver=false,reveal=false;

function flat(a){return a.reduce((r,x)=>r.concat(x),[])}
function setStatus(t){document.getElementById("status").textContent=t}
function makePlanes(){
  const result=[];
  let guard=0;
  while(result.length<3 && guard++<50000){
    const vert=Math.random()<0.5;
    const x=vert?Math.floor(Math.random()*10):Math.floor(Math.random()*8);
    const y=vert?Math.floor(Math.random()*8):Math.floor(Math.random()*10);
    const cells=[];
    for(let k=0;k<3;k++) cells.push((y+(vert?k:0))*10+x+(vert?0:k));
    if(!cells.some(c=>flat(result).indexOf(c)!==-1)) result.push(cells);
  }
  return result;
}
function proposed(i){
  const x=i%10,y=Math.floor(i/10);
  const cells=[];
  for(let k=0;k<3;k++){
    const xx=x+(vertical?0:k), yy=y+(vertical?k:0);
    if(xx<0||xx>=10||yy<0||yy>=10)return [-1];
    cells.push(yy*10+xx);
  }
  return cells;
}
function canPlace(cells){
  if(cells.indexOf(-1)!==-1)return false;
  const used=flat(myPlanes);
  return !cells.some(c=>used.indexOf(c)!==-1);
}
function draw(){
  const mg=document.getElementById("myGrid"),eg=document.getElementById("enemyGrid");
  mg.innerHTML="";eg.innerHTML="";
  const mine=flat(myPlanes),enemy=flat(enemyPlanes);
  for(let i=0;i<100;i++){
    const m=document.createElement("button");
    m.className="cell";
    if(mine.indexOf(i)!==-1)m.classList.add("plane");
    if(enemyShots.has(i))m.classList.add(mine.indexOf(i)!==-1?"hit":"miss");
    if(placing&&planeNumber<3&&canPlace(proposed(i)))m.classList.add("preview");
    m.onclick=function(){if(placing)place(i)};
    mg.appendChild(m);

    const e=document.createElement("button");
    e.className="cell";
    if(myShots.has(i))e.classList.add(enemy.indexOf(i)!==-1?"hit":"miss");
    else if(reveal&&enemy.indexOf(i)!==-1)e.classList.add("reveal");
    e.onclick=function(){attack(i)};
    eg.appendChild(e);
  }
}
function place(i){
  const cells=proposed(i);
  if(!canPlace(cells)){setStatus("❌ Avionul nu încape aici");return}
  myPlanes.push(cells);planeNumber++;
  if(planeNumber===3){
    placing=false;
    setStatus("🎯 Atacă adversarul!");
    document.getElementById("mySub").textContent="Toate avioanele sunt plasate.";
  }else{
    setStatus("📍 Plasează avionul "+(planeNumber+1)+" din 3");
  }
  draw();
}
function attack(i){
  if(placing||gameOver||myShots.has(i))return;
  myShots.add(i);
  const enemy=flat(enemyPlanes);
  if(enemy.length===9&&enemy.every(c=>myShots.has(c))){
    gameOver=true;setStatus("🏆 AIȘ CÂȘTIGAT!");
    alert("🏆 Ai câștigat! Ai distrus toate avioanele adversarului.");
    draw();return;
  }
  setStatus(enemy.indexOf(i)!==-1?"💥 Lovitură!":"💧 Ratat!");
  draw();
  window.setTimeout(enemyTurn,350);
}
function enemyTurn(){
  if(gameOver)return;
  const available=[];
  for(let i=0;i<100;i++)if(!enemyShots.has(i))available.push(i);
  if(!available.length)return;
  const i=available[Math.floor(Math.random()*available.length)];
  enemyShots.add(i);
  const mine=flat(myPlanes);
  if(mine.length===9&&mine.every(c=>enemyShots.has(c))){
    gameOver=true;setStatus("💥 AI-ul a câștigat!");
    alert("💥 AI-ul ți-a distrus toate avioanele.");
  }else{
    setStatus(mine.indexOf(i)!==-1?"💥 AI-ul te-a lovit!":"🎯 Rândul tău!");
  }
  draw();
}
function newGame(){
  myPlanes=[];enemyPlanes=makePlanes();myShots=new Set();enemyShots=new Set();
  placing=true;planeNumber=0;vertical=false;gameOver=false;reveal=false;
  setStatus("📍 Plasează avionul 1 din 3");
  document.getElementById("mySub").textContent="Atinge o celulă pentru a plasa avionul.";
  draw();
}
document.getElementById("newBtn").onclick=newGame;
document.getElementById("rotateBtn").onclick=function(){
  if(!placing){setStatus("Avioanele sunt deja plasate");return}
  vertical=!vertical;setStatus("↻ "+(vertical?"Vertical":"Orizontal"));draw();
};
document.getElementById("revealBtn").onclick=function(){reveal=!reveal;draw()};
newGame();
})();
</script>
</body>
</html>
